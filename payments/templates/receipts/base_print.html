{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        {% block title %}
        Invoice
        {% endblock %}
    </title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#ececec;
            font-family:Arial,Helvetica,sans-serif;
            font-size:14px;
        }

        .invoice-page{

            width:210mm;

            min-height:297mm;

            margin:20px auto;

            background:white;

            padding:18mm;

            box-shadow:0 0 10px rgba(0,0,0,.15);

        }

        h1,h2,h3,h4,h5{
            margin:0;
        }

        table{
            width:100%;
        }

        table th{
            background:#f3f3f3;
        }

        table th,
        table td{

            border:1px solid #dcdcdc;

            padding:8px;

            vertical-align:middle;

        }

        .section-title{

            font-size:18px;

            font-weight:700;

            border-bottom:2px solid #333;

            margin-bottom:15px;

            padding-bottom:5px;

        }

        .logo{

            width:80px;

            height:80px;

            object-fit:contain;

        }

        .total-table td{

            border:none;

            padding:6px;

        }

        .footer{

            margin-top:40px;

            border-top:1px dashed #999;

            padding-top:20px;

            text-align:center;

            color:#666;

            font-size:13px;

        }

        .no-print{
            margin:25px;
        }

        @media print{

            body{

                background:white;

            }

            .invoice-page{

                width:100%;

                margin:0;

                box-shadow:none;

                padding:10mm;

            }

            .no-print{

                display:none!important;

            }

        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

<div class="text-center no-print">

    <button
            class="btn btn-primary"
            onclick="window.print()">

        Print Receipt

    </button>

</div>

<div class="invoice-page">

{% block content %}
{% endblock %}

</div>

{% block scripts %}
{% endblock %}

</body>
</html>
