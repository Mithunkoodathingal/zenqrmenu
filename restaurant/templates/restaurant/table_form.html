{% extends 'restaurant/base.html' %}
{% block content %}

<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="max-width: 600px; width:100%;">
    <div class="card-body text-center">
      <h4 class="fw-bold text-orange mb-4">Add Table</h4>

      <!-- Inner card -->
      <div class="card shadow-sm p-3">
        <form method="post" class="d-flex justify-content-between align-items-center">
          {% csrf_token %}
          
          <!-- Input -->
          <div class="flex-grow-1 me-3">
            <input type="number" name="table_number" class="form-control" 
                   placeholder="Unique Table Number" required id="id_table_number">
          </div>

          <!-- Buttons -->
          <div class="d-flex">
            <button type="submit" class="btn btn-warning text-white fw-bold me-2">Add</button>
            <a href="{% url 'create_table_qr' %}" class="btn btn-danger fw-bold">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  .text-orange { color: #ff6600; }
</style>

{% endblock %}
