<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Zebra Menu{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    .bg-orange { background-color: #ff6600; }
    .text-orange { color: #ff6600; }
    .navbar-brand img { height: 32px; }
    .dropdown-menu { min-width: 180px; }
  </style>
</head>
<body>

  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      
      <!-- Brand -->
      <a class="navbar-brand fw-bold text-orange d-flex align-items-center" href="{% url 'dashboard' %}">
        <img src="{% static 'assetimages/zebra-logo.png' %}" alt="Logo" class="me-2" style="height:32px;">
        zebra menu
      </a>

      <!-- Nav items -->
      <div class="d-flex align-items-center">
        <a class="nav-link text-orange fw-bold me-4 d-flex align-items-center" href="#">
          <i class="bi bi-journal-text me-1"></i> Register
        </a>
        <a class="nav-link text-orange fw-bold me-4 d-flex align-items-center" href="#">
          <i class="bi bi-truck me-1"></i> Manage Menu
        </a>
        <a class="nav-link text-orange fw-bold me-4 d-flex align-items-center" href="#">
          <i class="bi bi-person-circle me-1"></i> Generate QR
        </a>
        <a class="nav-link text-orange fw-bold me-4 d-flex align-items-center" href="#">
          <i class="bi bi-box-arrow-in-right me-1"></i> Subscribe
        </a>

        <!-- Dropdown on far right -->
        <div class="dropdown">
          <button class="btn btn-outline-orange border-0" type="button" id="navbarDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-list fs-3 text-orange"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item fw-bold" href="{% url 'login' %}"><i class="bi bi-box-arrow-in-right me-2"></i> Login</a></li>
            <li><a class="dropdown-item fw-bold" href="{% url 'signup' %}"><i class="bi bi-person-plus-fill me-2"></i> Signup</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- ✅ Main Layout -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar include -->
      {% include 'restaurant/sidebar.html' %}

      <!-- Main content -->
      <div class="col-md-9 col-lg-10 p-4">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Sidebar dropdown script -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const toggleBtn = document.getElementById("settingsToggle");
      const menu = document.getElementById("settingsMenu");

      if (toggleBtn && menu) {
        toggleBtn.addEventListener("click", function() {
          menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "block" : "none";
        });

        document.addEventListener("click", function(e) {
          if (!toggleBtn.contains(e.target) && !menu.contains(e.target)) {
            menu.style.display = "none";
          }
        });
      }
    });
  </script>
</body>
</html>
