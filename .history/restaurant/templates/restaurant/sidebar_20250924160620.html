<div class="d-flex flex-column bg-orange text-white shadow-sm sidebar-desktop position-fixed top-0 start-0"
     style="height:100vh; width:250px; border-right: 1px solid rgba(0,0,0,0.08);">

  <!-- Brand -->
  <h4 class="p-3 text-center fw-bold"></h4>

  <!-- Nav -->
  <ul class="nav flex-column overflow-auto px-2 mt-10" style="flex:1;">
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name == 'dashboard' %}active bg-warning fw-bold{% endif %}"
         href="{% url 'manage_menu' %}">
        <i class="bi bi-speedometer2"></i>&nbsp; Dashboard
      </a>
    </li>
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name in 'category_create fooditem_create manage_menu' %}active bg-warning fw-bold{% endif %}"
         href="{% url 'manage_menu' %}">
        <i class="bi bi-list-ul"></i>&nbsp; Manage Menu
      </a>
    </li>
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name == 'menu_preview' %}active bg-warning fw-bold{% endif %}"
         href="{% url 'menu_preview' %}">
        <i class="bi bi-phone"></i>&nbsp; Menu View
      </a>
    </li>
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name in 'table_create create_table_qr' %}active bg-warning fw-bold{% endif %}"
         href="{% url 'create_table_qr' %}">
        <i class="bi bi-upc-scan"></i>&nbsp; Create Table/QR
      </a>
    </li>
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name == 'kitchen_interface' %}active bg-warning fw-bold{% endif %}"
         href="{% url 'kitchen_interface' %}">
        <i class="bi bi-receipt-cutoff"></i>&nbsp; Orders
      </a>
    </li>
  </ul>

  <!-- ✅ Fixed Footer -->
  <div class="bg-dark text-white text-center p-3 mt-auto position-relative">
    <div class="d-flex justify-content-center align-items-center">
      <p class="mb-0 fw-bold me-2">{{ request.user.username }}</p>
      <button class="btn btn-sm btn-light rounded-circle" id="settingsToggle" aria-haspopup="true" aria-expanded="false">
        <i class="bi bi-gear-fill"></i>
      </button>
    </div>

    <!-- Dropdown (now positioned relative to footer) -->
    <div id="settingsMenu" class="bg-white text-dark shadow rounded position-absolute p-2"
         style="bottom:60px; left:50%; transform:translateX(-50%); display:none; min-width:160px; z-index:1050;">
      {% if not has_subscription %}
        <a href="{% url 'subscription_plans' %}" class="dropdown-item text-warning fw-bold">
          <i class="bi bi-star-fill me-2"></i> Subscribe Now
        </a>
      {% endif %}
      <form method="post" action="{% url 'logout' %}" class="mb-0">
        {% csrf_token %}
        <button type="submit" class="dropdown-item text-danger fw-bold">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </button>
      </form>
    </div>
  </div>
</div>

<style>
/* ========== Sidebar hover + border styles (targets your existing classes) ========== */

/* Root sidebar container */
.sidebar-desktop {
  /* subtle outer border already applied inline; add an inner subtle shadow for depth */
  box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Nav links: spacing and transition */
.sidebar-desktop .nav-link {
  transition: background-color 0.18s ease, color 0.18s ease, padding-left 0.12s ease;
  padding: .6rem .75rem;
  border-radius: 6px;
}

/* Icon within nav link */
.sidebar-desktop .nav-link i {
  transition: transform 0.22s cubic-bezier(.2,.9,.2,1), color 0.22s ease;
  font-size: 1.05rem;
  /* make icons slightly lighter by default for contrast */
  color: rgba(255,255,255,0.95);
}

/* Hover state for link: gentle highlight + icon scale + color */
.sidebar-desktop .nav-link:hover {
  background-color: rgba(255, 255, 255, 0.06); /* faint white overlay on orange */
  color: #ffffff !important;
  padding-left: .9rem;
  text-decoration: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
}

/* Hover only icon color & scale */
.sidebar-desktop .nav-link:hover i {
  color: #fff;
  transform: scale(1.18) translateZ(0);
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
}

/* Active item: stronger appearance with small inner border */
.sidebar-desktop .nav-link.active,
.sidebar-desktop .nav-link.active.bg-warning {
  background-color: rgba(255,255,255,0.12) !important;
  color: #222 !important;          /* keep your bg-warning fw-bold style readable */
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06);
}

/* Make the "bg-warning fw-bold" state have a subtle right border */
.sidebar-desktop .nav-link.bg-warning {
  border-right: 4px solid rgba(0,0,0,0.06);
}

/* Focus (keyboard) accessibility */
.sidebar-desktop .nav-link:focus {
  outline: 3px solid rgba(255,255,255,0.12);
  outline-offset: 2px;
}

/* Footer settings button hover */
#settingsToggle {
  transition: transform 0.18s ease, background-color 0.18s ease;
}
#settingsToggle:hover {
  transform: translateY(-2px);
  background-color: rgba(255,255,255,0.95);
  color: #222;
}

/* Settings menu: small tweak so it animates visibility nicely */
#settingsMenu {
  transition: opacity 0.12s ease, transform 0.12s ease;
  transform-origin: bottom center;
  opacity: 1;
}

/* small screens: make sidebar narrower and preserve hover behaviour */
@media (max-width: 768px) {
  .sidebar-desktop { width: 220px !important; }
  .sidebar-desktop .nav-link { font-size: .95rem; padding: .5rem .6rem; }
  .sidebar-desktop .nav-link i { font-size: 1rem; }
}
</style>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const toggleBtn = document.getElementById("settingsToggle");
    const menu = document.getElementById("settingsMenu");

    toggleBtn.addEventListener("click", function(e) {
      e.stopPropagation(); // prevent auto close
      if (!menu) return;
      const isHidden = !menu.style.display || menu.style.display === "none";
      menu.style.display = isHidden ? "block" : "none";
      toggleBtn.setAttribute('aria-expanded', isHidden ? 'true' : 'false');
    });

    document.addEventListener("click", function(e) {
      if (!toggleBtn.contains(e.target) && menu && !menu.contains(e.target)) {
        menu.style.display = "none";
        toggleBtn.setAttribute('aria-expanded', 'false');
      }
    });

    // optional: keyboard escape to close menu
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && menu && menu.style.display === 'block') {
        menu.style.display = 'none';
        toggleBtn.setAttribute('aria-expanded', 'false');
      }
    });
  });
</script>
