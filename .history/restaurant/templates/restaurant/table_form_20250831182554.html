{% extends 'restaurant/basedash.html' %}

{% block content %}
<div class="form-container">
    <div class="custom-card">
        <h4 class="mb-4 text-center">Add a New Table</h4>
        
        <form method="post" class="d-flex justify-content-center align-items-center">
            {% csrf_token %} <div class="me-3 flex-grow-1">
                {{ form.as_p }}
            </div>
            
            <div>
                <button type="submit" class="btn btn-orange">Add</button>
                <a href="{% url 'create_table_qr' %}" class="btn btn-red">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
