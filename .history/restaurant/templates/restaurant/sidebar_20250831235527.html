<div class="col-md-3 col-lg-2 p-0 bg-orange shadow-sm d-flex flex-column" style="min-height:100vh;">
  
  <!-- Brand -->
  <h4 class="p-3 text-center fw-bold text-white">zebra menu</h4>

  <!-- Navigation -->
  <ul class="nav flex-column flex-grow-1">
    <!-- Dashboard -->
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name == 'dashboard' %}active bg-warning fw-bold{% endif %}" 
         href=>
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
    </li>

    <!-- Manage Menu -->
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name in 'category_create fooditem_create manage_menu' %}active bg-warning fw-bold{% endif %}" 
         href="{% url 'manage_menu' %}">
        <i class="bi bi-list-ul me-2"></i> Manage Menu
      </a>
    </li>

    <!-- Menu Preview -->
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name == 'menu_preview' %}active bg-warning fw-bold{% endif %}" 
         href="{% url 'menu_preview' %}">
        <i class="bi bi-phone me-2"></i> Menu View
      </a>
    </li>

    <!-- Create Table / QR -->
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name in 'table_create create_table_qr' %}active bg-warning fw-bold{% endif %}" 
         href="{% url 'create_table_qr' %}">
        <i class="bi bi-upc-scan me-2"></i> Create Table/QR
      </a>
    </li>

    <!-- Orders -->
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name == 'kitchen_interface' %}active bg-warning fw-bold{% endif %}" 
         href="{% url 'kitchen_interface' %}">
        <i class="bi bi-receipt-cutoff me-2"></i> Orders
      </a>
    </li>
  </ul>

  <!-- Footer (always bottom) -->
  <div class="bg-dark text-white text-center p-3 position-relative">
    <div class="d-flex justify-content-center align-items-center">
      <p class="mb-0 fw-bold me-2">{{ request.user.username }}</p>
      <button class="btn btn-sm btn-light rounded-circle" id="settingsToggle">
        <i class="bi bi-gear-fill"></i>
      </button>
    </div>

    <!-- Dropdown -->
    <div id="settingsMenu" class="bg-white text-dark shadow rounded position-absolute p-2"
         style="bottom:60px; left:50%; transform:translateX(-50%); display:none; min-width:160px; z-index:1000;">
      {% if not has_subscription %}
        <a href="{% url 'subscription_plans' %}" class="dropdown-item text-warning fw-bold">
          <i class="bi bi-star-fill me-2"></i> Subscribe Now
        </a>
      {% endif %}
      <form method="post" action="{% url 'logout' %}" class="mb-0">
        {% csrf_token %}
        <button type="submit" class="dropdown-item text-danger fw-bold">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </button>
      </form>
    </div>
  </div>
</div>
