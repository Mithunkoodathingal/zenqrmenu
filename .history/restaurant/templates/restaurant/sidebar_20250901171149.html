<div class="d-flex flex-column bg-orange text-white shadow-sm sidebar-desktop position-fixed top-0 start-0" 
     style="height:100vh; width:250px;">

  <!-- Brand -->
  <h4 class="p-3 text-center fw-bold"></h4>

  <!-- Nav (scrollable if long) -->
  <ul class="nav flex-column overflow-auto px-2 mt-10" style="flex:1;">
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name == 'dashboard' %}active bg-warning fw-bold{% endif %}" 
         href="#">
        <i class="bi bi-speedometer2"></i>&nbsp; Dashboard
      </a>
    </li>
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name in 'category_create fooditem_create manage_menu' %}active bg-warning fw-bold{% endif %}" 
         href="{% url 'manage_menu' %}">
        <i class="bi bi-list-ul me-2"></i>&nbsp; Manage Menu
      </a>
    </li>
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name == 'menu_preview' %}active bg-warning fw-bold{% endif %}" 
         href="{% url 'menu_preview' %}">
        <i class="bi bi-phone me-2"></i>&nbsp; Menu View
      </a>
    </li>
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name in 'table_create create_table_qr' %}active bg-warning fw-bold{% endif %}" 
         href="{% url 'create_table_qr' %}">
        <i class="bi bi-upc-scan me-2"></i>&nbsp; Create Table/QR
      </a>
    </li>
    <li class="nav-item pb-1">
      <a class="nav-link text-white d-flex align-items-center text-nowrap {% if request.resolver_match.url_name == 'kitchen_interface' %}active bg-warning fw-bold{% endif %}" 
         href="{% url 'kitchen_interface' %}">
        <i class="bi bi-receipt-cutoff"></i>&nbsp; Orders
      </a>
    </li>
  </ul>

  <!-- ✅ Fixed Footer -->
  <div class="bg-dark text-white text-center p-3 mt-auto">
    <div class="d-flex justify-content-center align-items-center">
      <p class="mb-0 fw-bold me-2">{{ request.user.username }}</p>
      <button class="btn btn-sm btn-light rounded-circle" id="settingsToggle">
        <i class="bi bi-gear-fill"></i>
      </button>
    </div>

    <!-- Dropdown -->
    <div id="settingsMenu" class="bg-white text-dark shadow rounded position-absolute p-2"
         style="bottom:70px; left:50%; transform:translateX(-50%); display:none; min-width:160px; z-index:1000;">
      {% if not has_subscription %}
        <a href="{% url 'subscription_plans' %}" class="dropdown-item text-warning fw-bold">
          <i class="bi bi-star-fill me-2"></i> Subscribe Now
        </a>
      {% endif %}
      <form method="post" action="{% url 'logout' %}" class="mb-0">
        {% csrf_token %}
        <button type="submit" class="dropdown-item text-danger fw-bold">
          <i class="bi bi-box-arrow-right me-2"></i> Logout
        </button>
      </form>
    </div>
  </div>
</div>
