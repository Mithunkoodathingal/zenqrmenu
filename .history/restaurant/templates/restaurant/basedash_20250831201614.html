<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Zebra Menu{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .bg-orange { background-color: #ff6600; } /* matches your screenshots */
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      {% include 'restaurant/sidebar.html' %}
      
      <!-- Main Content -->
      <div class="col-md-9 col-lg-10 p-4">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
