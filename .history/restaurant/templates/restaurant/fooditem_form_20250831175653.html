{% comment %} {% extends 'restaurant/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Add New Food Item</h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Category</label>
                            {{ form.category }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Item Name</label>
                            {{ form.name }}
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Price (₹)</label>
                                {{ form.price }}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Description</label>
                                {{ form.description }}
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Upload Image</label>
                            {{ form.image }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Add Add-Ons</label>
                            {{ form.addon_input }}
                            <div id="addon-tags" class="mt-2 d-flex flex-wrap"></div>
                            <input type="hidden" name="addon_data" id="addon-data">
                        </div>
                        
                        

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save Item
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const input = document.getElementById("addon-input");
    const tagContainer = document.getElementById("addon-tags");
    const hiddenInput = document.getElementById("addon-data");
    let addons = [];
  
    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter" || e.key === ",") {
        e.preventDefault();
        const value = input.value.trim();
        if (value && value.includes(":")) {
          addons.push(value);
          renderTags();
          input.value = "";
          hiddenInput.value = JSON.stringify(addons);
        }
      }
    });
  
    function renderTags() {
      tagContainer.innerHTML = "";
      addons.forEach((addon, index) => {
        const span = document.createElement("span");
        span.className = "badge bg-info text-dark me-2 mb-2";
        span.textContent = addon;
        span.style.cursor = "pointer";
        span.title = "Click to remove";
        span.onclick = () => {
          addons.splice(index, 1);
          renderTags();
          hiddenInput.value = JSON.stringify(addons);
        };
        tagContainer.appendChild(span);
      });
    }
  </script>
  
  

<!-- Bootstrap Icons (if needed) -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> {% endcomment %}
{% comment %} {% endblock %} {% endcomment %}
