<div class="col-md-3 col-lg-2 p-0 bg-orange shadow-sm" style="min-height:100vh;">
  <div class="d-flex flex-column text-white h-100">
    <h4 class="p-3 text-center fw-bold">zebra menu</h4>
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link text-white {% if request.resolver_match.url_name == 'dashboard' %}active bg-warning fw-bold{% endif %}" href="{% url 'dashboard' %}">
          Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white {% if request.resolver_match.url_name in 'category_create fooditem_create' %}active bg-warning fw-bold{% endif %}" href="{% url 'category_create' %}">
          Manage Menu
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white {% if request.resolver_match.url_name == 'menu_view' %}active bg-warning fw-bold{% endif %}" href="#">
          Menu View
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white {% if request.resolver_match.url_name in 'table_create create_table_qr' %}active bg-warning fw-bold{% endif %}" href="{% url 'create_table_qr' %}">
          Create Table/QR
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white {% if request.resolver_match.url_name == 'kitchen_interface' %}active bg-warning fw-bold{% endif %}" href="{% url 'kitchen_interface' %}">
          Orders
        </a>
      </li>
    </ul>
    <div class="mt-auto text-center p-3 bg-light text-dark">
      <p class="mb-1">{{ request.user.username }}</p>
      {% if not has_subscription %}
      <a href="{% url 'subscription_plans' %}" class="fw-bold text-danger">Subscribe Now</a>
      {% endif %}
    </div>
  </div>
</div>
