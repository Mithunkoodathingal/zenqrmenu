{% extends 'restaurant/base1.html' %}
{% load static %}

{% block title %}Menu{% endblock %}

{% block content %}
<section class="content-inner">
  <div class="container">
    <div class="row">
      {% for item in food_items %}
      <div class="col-xl-3 col-lg-4 col-md-6 m-b30">
        <a href="{% url 'product_detail' restaurant.id table.id item.id %}" class="text-decoration-none">
          <div class="dz-img-box style-4 box-hover">
            <div class="dz-media">
              {% if item.image %}
                <img src="{{ item.image.url }}" alt="{{ item.name }}">
              {% else %}
                <img src="{% static 'assets/images/menu-small/pic1.png' %}" alt="{{ item.name }}">
              {% endif %}
            </div>
            <div class="dz-content">
              <h5 class="title">{{ item.name }}</h5>
              <p>{{ item.description|truncatechars:50 }}</p>
              <h6 class="text-primary">₹{{ item.price }}</h6>
            </div>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
