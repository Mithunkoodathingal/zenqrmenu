{% extends 'restaurant/base1.html' %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h3>Password reset</h3>
      <p>Enter the email address associated with your account. We'll email a link to reset your password.</p>

      <form method="post">
        {% csrf_token %}
        {{ form.email }}
        <div class="mt-3">
          <button class="btn btn-warning" type="submit">Send reset link</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
