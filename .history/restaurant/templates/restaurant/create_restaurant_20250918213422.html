{% extends 'restaurant/base1.html' %}
{% block content %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zebra Menu - Setup Restaurant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #fff;
      font-family: Arial, sans-serif;
    }
    
    /* Cards */
    .setup-card {
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      background: #fff;
      padding: 2rem;
    }
    .form-title {
      color: #f97316;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }
    .form-control {
      border: 2px solid #f97316;
      border-radius: 8px;
    }
    .form-control:focus {
      border-color: #ea580c;
      box-shadow: none;
    }
    .btn-orange {
      background-color: #f97316;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
    }
    .btn-orange:hover {
      background-color: #ea580c;
      color: #fff;
    }
    .btn-outline-orange {
      border: 2px solid #f97316;
      color: #f97316;
      font-weight: bold;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
    }
    .btn-outline-orange:hover {
      background: #f97316;
      color: #fff;
    }
    .upload-group input[type="file"] {
      display: none;
    }
    .upload-group label {
      background-color: #f97316;
      color: #fff;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      margin-left: 0.5rem;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  {% comment %} <nav class="navbar navbar-expand-lg">
    <a class="navbar-brand" href="#">
      <img src="{% static 'images/logo.png' %}" alt="Logo" style="height: 30px; margin-right: 8px;">
      zebra menu
    </a>
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
      <i class="bi bi-list"></i>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarMenu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-pencil-square"></i> Register</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-menu-button-wide"></i> Manage Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-person"></i> Generate QR</a></li>
        <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-credit-card"></i> Subscribe</a></li>
      </ul>
    </div>
  </nav> {% endcomment %}

  <!-- Main Content -->
  <div class="container my-5">
    <div class="row g-4 justify-content-center">
      
      <!-- Left Image Placeholder -->
      <div class="col-12 col-md-6">
        <div class="setup-card text-center">
          <img src="{% static 'assets/images/login-placeholder.jpg' %}" alt="Restaurant Image" class="img-fluid">
        </div>
      </div>

      <!-- Right Form -->
      <div class="col-12 col-md-6">
        <div class="setup-card">
          <h5 class="form-title text-center">Setup Your Restaurant</h5>
          <form method="post" enctype="multipart/form-data" action="{% url 'create_restaurant' %}">
            {% csrf_token %}
            <div class="mb-3">
              <input type="text" name="name" class="form-control" placeholder="Restaurant Name" required>
            </div>
            <div class="mb-3">
              <input type="text" name="address" class="form-control" placeholder="Address" required>
            </div>
            <div class="mb-3">
              <textarea name="about" class="form-control" rows="3" placeholder="About your restaurant..."></textarea>
            </div>
                                 <!-- Cover Image -->
              <div class="mb-3">
                <label for="cover_image" class="form-label">Cover Image</label>
                <input type="file" name="cover_image" id="cover_image" class="form-control">
              </div>
            <div class="d-flex justify-content-between">
              <button type="submit" class="btn btn-orange">Create Restaurant</button>
              <a href="#" class="btn btn-outline-orange">Cancel</a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
