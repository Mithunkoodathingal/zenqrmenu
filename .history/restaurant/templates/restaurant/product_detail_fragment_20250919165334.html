{% load static %}
<div class="product-detail" data-item-id="{{ item.id }}">
  <div class="left">
    <div class="hero">
      {% if item.image %}
        <img src="{{ item.image.url }}" alt="{{ item.name }}">
      {% else %}
        <img src="{% static 'assets/images/menu-small/pic1.png' %}" alt="{{ item.name }}">
      {% endif %}
    </div>
  </div>

  <div class="right">
    <div class="veg-tag" aria-hidden="true">
      <span class="veg-dot"></span>
      <span>Pure veg</span>
    </div>

    <h1 class="product-title">{{ item.name }}</h1>

    <p class="product-desc">{{ item.description|default:"Delicious & made fresh." }}</p>

    <div class="price-qty-row">
      <div class="price-block">
        <div style="color:#777;">Price</div>
        <div class="amount">₹{{ item.price }}</div>
      </div>

      <div>
        <div style="color:#777; margin-bottom:6px;">Quantity</div>
        <div class="qty-control" role="group" aria-label="Quantity controls">
          <button type="button" class="qty-decrease" aria-label="Decrease quantity">−</button>
          <input class="qty-input" name="quantity" type="number" value="1" min="1" aria-label="Quantity" />
          <button type="button" class="qty-increase" aria-label="Increase quantity">+</button>
        </div>
      </div>
    </div>

    <div style="margin-bottom:8px; font-weight:700;">Add On</div>

    <div class="addons-grid" role="list">
      {% for addon in addons %}
      <label class="addon-card" data-addon-id="{{ addon.id }}" role="listitem">
        <div class="addon-left">
          {% if addon.image %}
            <img src="{{ addon.image.url }}" alt="{{ addon.name }}">
          {% else %}
            <img src="{% static 'assets/images/menu-small/pic1.png' %}" alt="{{ addon.name }}">
          {% endif %}
          <div>
            <div class="addon-title">{{ addon.name }}</div>
            <div class="addon-price">+ ₹{{ addon.price }}</div>
          </div>
        </div>
        <!-- 'addons[]' name ensures server sees addons in POST -->
        <input type="checkbox" class="addon-checkbox" name="addons[]" value="{{ addon.id }}" aria-label="Add {{ addon.name }}">
      </label>
      {% empty %}
        <div class="text-muted">No add-ons available</div>
      {% endfor %}
    </div>

    <div class="action-row">
      <!-- Add to cart (only adds, does NOT redirect to confirmation) -->
      <button type="button" class="btn-add fragment-add" aria-label="Add to cart">Add To Cart</button>

      <!-- Cancel: closes modal and does not add anything -->
      <button type="button" class="btn-add btnCancel  bg-warning text-white" aria-label="Cancel">Cancel</button>
    </div>
  </div>
</div>
