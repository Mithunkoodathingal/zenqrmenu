{% extends 'restaurant/basedash.html' %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="card shadow-lg p-4" style="max-width:600px; width:100%;">
    <h4 class="text-center fw-bold text-orange mb-4">Add Table</h4>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex">
        {{ form.table_number|add_class:"form-select me-2" }}
        <button type="submit" class="btn btn-warning fw-bold text-white me-2">Add</button>
        <a href="{% url 'dashboard' %}" class="btn btn-danger fw-bold">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
