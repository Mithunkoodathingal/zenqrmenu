{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ restaurant.name }} - Menu</title>

  <!-- original CSS includes -->
  <link href="{% static 'assets/vendor/magnific-popup/magnific-popup.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-select/css/bootstrap-select.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/vendor/rangeslider/rangeslider.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendor/nouislider/nouislider.min.css' %}">
  <link rel="stylesheet" href="{% static 'assets/vendor/switcher/switcher.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">

  <style>
    /* Banner */
    .restaurant-banner { position: relative; width:100%; height:300px; overflow:hidden; }
    .restaurant-cover { width:100%; height:100%; object-fit:cover; filter:brightness(0.7); }
    .overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.45); }
    .restaurant-info{ position:absolute;top:50%;left:50%;transform:translate(-50%,-50%); color:#fff; text-align:center; padding:0 12px;}
    .restaurant-name{ font-size:2.2rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; }
    .restaurant-description{ font-size:1rem; font-weight:300; margin-top:6px; max-width:900px; }

    /* Card */
    .menu-card {
      background:#fff;
      border-radius:10px;
      padding:12px;
      box-shadow:0 8px 20px rgba(38,50,56,0.06);
      display:flex;
      flex-direction:row;        /* always left/right */
      align-items:center;
      gap:12px;
      min-height:120px;
      transition: transform .18s ease;
      position:relative;
    }
    .menu-card:hover { transform:translateY(-6px); }

    /* Image column */
    .menu-card .img-wrap {
      flex: 0 0 90px;             /* fixed width */
      height: 90px;
      display:flex;
      justify-content:center;
      align-items:center;
      background: #fafafa;
      border-radius:8px;
      padding:6px;
    }
    .menu-card img {
      max-height:100%;
      max-width:100%;
      object-fit:cover;
      border-radius:6px;
    }

    /* Content column */
    .menu-card .content {
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .menu-card .title { font-size:1rem; font-weight:700; margin:0 0 4px; color:#222; }
    .menu-card .desc { font-size:.88rem; color:#666; margin:0 0 6px; line-height:1.2; overflow:hidden; }
    .menu-card .meta { display:flex; justify-content:space-between; align-items:center; }
    .menu-card .price { font-size:1rem; font-weight:800; color:#2f9c44; }

    /* Plus badge */
    .plus-badge{ position:absolute; right:12px; bottom:12px; background:#6aa84f; color:#fff; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }

    /* Responsive adjustments but keep side-by-side */
    @media (max-width:576px){
      .restaurant-banner{ height:220px; }
      .restaurant-name{ font-size:1.6rem; }
      .menu-card { padding:10px; gap:8px; }
      .menu-card .img-wrap { flex:0 0 70px; height:70px; }
      .menu-card .title { font-size:.95rem; }
      .menu-card .desc { font-size:.8rem; max-height:32px; }
      .menu-card .price { font-size:.9rem; }
    }
  </style>
</head>
<body>
  {# … keep the same body as before, no change in HTML … #}
</body>
</html>
