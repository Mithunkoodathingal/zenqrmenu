{% extends 'restaurant/base1.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zebra Menu - Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .btn-orange { background-color: #f97316; color: white; }
    .btn-orange:hover { background-color: #ea580c; color: white; }
    .form-control { border: 2px solid #f97316; border-radius: 8px; }
    .form-control:focus { border-color: #ea580c; box-shadow: none; }
    .form-title { font-weight: bold; color: #f97316; margin-bottom: 1.5rem; text-align: center; }
    .card-container { box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; }
    .card-left { background: #f8f9fa; padding: 2rem; display: flex; justify-content: center; align-items: center; }
    .card-right { background: #fff; padding: 2rem 3rem; }
  </style>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="row card-container w-100" style="max-width: 850px;">
      <div class="col-md-6 d-none d-md-flex card-left">
        <img src="{% static 'assets/images/signup-placeholder.jpg' %}" alt="SignUp Illustration" class="img-fluid">
      </div>

      <div class="col-12 col-md-6 card-right">
        <h4 class="form-title">Sign-Up</h4>

        {% if messages %}
          {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'signup' %}">
          {% csrf_token %}
          <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="User Name" value="{{ request.POST.username }}" required>
          </div>
          <div class="mb-3">
            <input type="email" name="email" class="form-control" placeholder="Email" value="{{ request.POST.email }}" required>
          </div>
          <div class="mb-3">
            <input type="password" name="password1" class="form-control" placeholder="Password" required>
          </div>
          <div class="mb-3">
            <input type="password" name="password2" class="form-control" placeholder="Re-write Password" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-orange">Sign-Up</button>
          </div>
        </form>

        <div class="text-center mt-3">
          <small>Already have an account ?</small>
          <a href="{% url 'login' %}" class="btn btn-orange btn-sm ms-2">Login</a>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
{% endblock %}
