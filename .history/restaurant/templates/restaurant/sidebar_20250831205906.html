<div class="col-md-3 col-lg-2 p-0 bg-orange shadow-sm d-flex flex-column" style="min-height:100vh;">
  <!-- Brand -->
  <h4 class="p-3 text-center fw-bold text-white">zebra menu</h4>

  <!-- Navigation -->
  <ul class="nav flex-column flex-grow-1">
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name == 'dashboard' %}active bg-warning fw-bold{% endif %}" href="{% url 'dashboard' %}">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name in 'category_create fooditem_create manage_menu' %}active bg-warning fw-bold{% endif %}" href="{% url 'manage_menu' %}">
        <i class="bi bi-list-ul me-2"></i> Manage Menu
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name == 'menu_view' %}active bg-warning fw-bold{% endif %}" href="#">
        <i class="bi bi-phone me-2"></i> Menu View
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name in 'table_create create_table_qr' %}active bg-warning fw-bold{% endif %}" href="{% url 'create_table_qr' %}">
        <i class="bi bi-upc-scan me-2"></i> Create Table/QR
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link text-white d-flex align-items-center {% if request.resolver_match.url_name == 'kitchen_interface' %}active bg-warning fw-bold{% endif %}" href="{% url 'kitchen_interface' %}">
        <i class="bi bi-receipt-cutoff me-2"></i> Orders
      </a>
    </li>
  </ul>

  <!-- Footer Section (sticks to bottom) -->
  <div class="mt-auto bg-dark text-white text-center p-3">
    <p class="mb-1 fw-bold">{{ request.user.username }}</p>

    {% if not has_subscription %}
      <a href="{% url 'subscription_plans' %}" class="btn btn-sm btn-warning text-dark fw-bold mb-2">
        Subscribe Now
      </a>
    {% endif %}

    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-danger fw-bold">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </button>
    </form>
  </div>
</div>
