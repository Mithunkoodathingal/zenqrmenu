{% extends 'restaurant/base.html' %}

{% block content %}
<div class="card text-center">
    <div class="card-header">
        <h2>Table {{ table.table_number }} QR Code</h2>
    </div>
    <div class="card-body">
        <img src="{{ table.qr_code.url }}" alt="QR Code" class="img-fluid mb-3" style="max-width: 300px;">
        <p class="text-muted">Scan this QR code to view the menu</p>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</div>
{% endblock %}
